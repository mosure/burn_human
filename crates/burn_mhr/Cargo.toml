[package]
name = "burn_mhr"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Momentum Human Rig identity, expression, articulation and corrective evaluation on Burn"
repository = "https://github.com/mosure/burn_human"

[features]
default = []
wgpu = ["burn/wgpu"]
ndarray = ["burn/ndarray"]
tools = ["wgpu", "dep:pollster"]

[dependencies]
anyhow = "1"
burn = { version = "0.21", default-features = false, features = ["std"] }
burn_human_motion = { path = "../burn_human_motion", version = "0.1.0" }
burn_human_inference = { path = "../burn_human_inference", version = "0.1.0", features = ["transport"] }
glam = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
pollster = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[[bin]]
name = "mhr-validate"
path = "src/bin/validate.rs"
required-features = ["tools"]
