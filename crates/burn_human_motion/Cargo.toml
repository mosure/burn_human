[package]
name = "burn_human_motion"
version = "0.1.0"
edition = "2024"
description = "Portable motion, rig, conditioning, and verified model artifact contracts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mosure/burn_human"

[dependencies]
anyhow = "1"
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
