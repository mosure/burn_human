[package]
name = "burn_soma"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "SOMA-X parametric identity, procedural rig, correctives and skinning on Burn"
repository = "https://github.com/mosure/burn_human"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wgpu = ["burn/wgpu"]
ndarray = ["burn/ndarray"]
tools = ["wgpu", "dep:pollster"]
mhr = ["dep:burn_mhr"]
web-validation = ["wgpu", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:console_error_panic_hook"]

[dependencies]
anyhow = "1"
burn = { version = "0.21", default-features = false, features = ["std"] }
burn_human_motion = { path = "../burn_human_motion", version = "0.1.0" }
burn_human_inference = { path = "../burn_human_inference", version = "0.1.0", features = ["transport"] }
burn_mhr = { path = "../burn_mhr", version = "0.1.0", optional = true }
glam = "0.32"
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
pollster = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[[bin]]
name = "soma-validate"
path = "src/bin/validate.rs"
required-features = ["tools"]

[[bin]]
name = "mhr-soma-validate"
path = "src/bin/mhr_validate.rs"
required-features = ["tools", "mhr"]
