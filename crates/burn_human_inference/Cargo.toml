[package]
name = "burn_human_inference"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Verified bounded Burnpack transport and portable model tensor utilities"
repository = "https://github.com/mosure/burn_human"

[features]
default = []
transport = ["cooperative", "dep:ureq"]
cooperative = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
wgpu = ["dep:burn-cubecl", "burn/wgpu", "burn/cubecl", "burn/extension", "dep:wgpu", "cooperative"]
cpu = ["burn/flex"]
# Compatibility alias; CPU inference now uses Burn Flex.
ndarray = ["cpu"]
tools = ["dep:pollster"]

[dependencies]
ciborium = "0.2"
anyhow = "1"
burn = { version = "0.22", default-features = false, features = ["std"] }
burn-cubecl = { version = "0.22", default-features = false, optional = true }
burn-pack = { version = "0.22", default-features = false, features = ["std"] }
burn-store = { version = "0.22", default-features = false, features = ["std"] }
bytes = "1"
wgpu = { version = "30", default-features = false, optional = true }
burn_human_motion = { path = "../burn_human_motion", version = "0.2.0" }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
burn = { version = "0.22", default-features = false, features = ["autotune"] }
ureq = { version = "3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[[bin]]
name = "human-model-pack"
path = "src/bin/pack.rs"
required-features = ["tools"]

[[bin]]
name = "quant-parity"
path = "src/bin/quant_parity.rs"
required-features = ["tools", "wgpu"]

[dev-dependencies]
pollster = "0.4"
tempfile = "3"
