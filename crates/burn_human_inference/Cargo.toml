[package]
name = "burn_human_inference"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Verified bounded Burnpack transport and portable model tensor utilities"
repository = "https://github.com/mosure/burn_human"

[features]
default = []
transport = ["dep:ureq", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
wgpu = ["burn/wgpu"]
ndarray = ["burn/ndarray"]
tools = ["dep:pollster"]

[dependencies]
anyhow = "1"
burn = { version = "0.21", default-features = false, features = ["std"] }
burn-store = { version = "0.21", default-features = false, features = ["std", "burnpack"] }
burn_human_motion = { path = "../burn_human_motion", version = "0.1.0" }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[[bin]]
name = "human-model-pack"
path = "src/bin/pack.rs"
required-features = ["tools"]

[[bin]]
name = "quant-parity"
path = "src/bin/quant_parity.rs"
required-features = ["tools", "wgpu"]
