[package]
name = "bevy_burn_human"
description = "bevy plugin for burn_human morphable models"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/mosure/burn_human"
repository = "https://github.com/mosure/burn_human"
publish = true
exclude = ["www"]

[features]
default = ["native"]
native = ["bevy/multi_threaded"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_gltf",
    "bevy_image",
    "bevy_log",
    "bevy_light",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_post_process",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "jpeg",
    "png",
    "std",
    "tonemapping_luts",
    "webgpu",
    "x11",
    "zstd_rust",
] }
burn_human = { version = "0.5", path = "../../" }
burn_human_motion = { version = "0.1.0", path = "../burn_human_motion" }
burn_ardy = { version = "0.1.0", path = "../burn_ardy", default-features = false, features = ["wgpu", "transport"] }
burn_ardy_text = { version = "0.1.0", path = "../burn_ardy_text", features = ["wgpu"] }
burn_soma = { version = "0.1.0", path = "../burn_soma", features = ["wgpu", "mhr"] }
burn_gem = { version = "0.1.0", path = "../burn_gem", features = ["wgpu"] }
burn = { version = "0.21", default-features = false, features = ["std", "wgpu"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
bevy_egui = { version = "0.42", default-features = false, features = ["default_fonts", "render"] }
bevy_panorbit_camera = "0.35.1"
noise = "0.9"
fastrand = "2"
anyhow = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"


[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
