[package]
name = "burn_human"
description = "parametric human mesh pipeline"
version = "0.5.0"
edition = "2024"
authors = ["mosure <mitchell@mosure.me>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/mosure/burn_human"
repository = "https://github.com/mosure/burn_human"
readme = "README.md"
exclude = [
  ".cargo",
  ".gitattributes",
  ".gitignore",
  ".devcontainer",
  ".github",
  "docs",
  "dist",
  "build",
  "assets",
  "credits",
]

[workspace]
members = [
  "crates/bevy_burn_human",
  "crates/burn_human_motion",
  "crates/burn_ardy",
  "crates/burn_human_inference",
  "crates/burn_ardy_text",
  "crates/burn_soma",
  "crates/burn_mhr",
  "crates/burn_gem",
  "tool",
]
resolver = "2"


[features]
default = []

[dependencies]
burn_human_motion = { version = "0.1.0", path = "crates/burn_human_motion" }
glam = "0.32"
burn = { version = "0.21", default-features = false, features = ["std", "ndarray"], optional = true }
safetensors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
bytemuck = { version = "1.18", features = ["derive"] }
half = "2.4"


[dev-dependencies]
criterion = "0.8"


[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1


[[bench]]
name = "forward"
harness = false
path = "bench/forward.rs"
