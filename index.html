<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>burn_human · Motion, bodies and image pose</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a0d14; color: #e4e9f2; font: 16px/1.5 system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; outline: none; }
      #loading { position: absolute; inset: 0; display: grid; place-content: center; padding: 32px; text-align: center; }
      #loading p { max-width: 540px; color: #b8c6dc; }
      #spinner { margin: 0 auto 16px; width: 28px; height: 28px; border: 2px solid #334155; border-top-color: #74bee8; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-live="polite">
      <div id="spinner"></div>
      <strong id="title">Preparing the human studio</strong>
      <p id="detail">Explore text-driven motion, editable bodies and image-to-pose inference. Model weights download when you choose to load them.</p>
    </div>
    <script type="module">
      try {
        if (!navigator.gpu) throw new Error('This browser does not expose WebGPU. Open the studio in a WebGPU-enabled browser, or run the native Bevy application.');
        const { default: init } = await import('./out/bevy_burn_human.js');
        await init();
        document.getElementById('loading').remove();
      } catch (error) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'The studio could not start';
        document.getElementById('detail').textContent = error.message || String(error);
        console.error(error);
      }
      document.addEventListener('contextmenu', event => {
        if (event.target instanceof HTMLCanvasElement) event.preventDefault();
      });
    </script>
  </body>
</html>
