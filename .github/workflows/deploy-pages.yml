name: deploy github pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1


jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v3

      - name: setup nightly rust toolchain with caching
        uses: brndnmtthws/rust-action@v1
        with:
          toolchain: nightly
          components: rustfmt, clippy
          enable-sccache: "false"

      - name: install wasm32-unknown-unknown
        run: rustup target add wasm32-unknown-unknown

      - name: setup Python for build metadata
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install the locked wasm-bindgen-cli version
        run: |
          python3 - <<'PYBINDGEN'
          import subprocess, tomllib
          with open('Cargo.lock', 'rb') as lock:
              packages = tomllib.load(lock)['package']
          version = next(p['version'] for p in packages if p['name'] == 'wasm-bindgen')
          subprocess.run(['cargo', 'install', 'wasm-bindgen-cli', '--version', version, '--locked'], check=True)
          PYBINDGEN

      # - name: install wasm-opt
      #   run: cargo install wasm-opt --locked

      - name: build the WebGPU studio (explicit feature)
        run: cargo build -p bevy_burn_human --target wasm32-unknown-unknown --release --no-default-features --features studio --bin bevy_burn_human --locked

      # - name: optimize wasm artifacts
      #   run: wasm-opt -O -ol 100 -s 100 -o ./target/wasm32-unknown-unknown/release/bevy_burn_human_opt.wasm ./target/wasm32-unknown-unknown/release/bevy_burn_human.wasm

      - name: generate bindings with wasm-bindgen
        run: wasm-bindgen --out-dir ./crates/bevy_burn_human/www/out/ --target web ./target/wasm32-unknown-unknown/release/bevy_burn_human.wasm

      - name: record the deployed studio build
        run: |
          python3 - <<'PYBUILD'
          import json, os, pathlib
          path = pathlib.Path('crates/bevy_burn_human/www/build.json')
          path.write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'features': ['studio'],
              'target': 'wasm32-unknown-unknown',
              'profile': 'release',
          }, indent=2) + '\n')
          PYBUILD

      - name: copy assets
        run: |
          mkdir -p ./crates/bevy_burn_human/www/assets
          cp -R ./assets/. ./crates/bevy_burn_human/www/assets/

      - name: deploy to github pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./crates/bevy_burn_human/www
          branch: www